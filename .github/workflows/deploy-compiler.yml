name: Deploy BlockAds Compiler Container

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'workers/compiler/**'
      - '.github/workflows/deploy-compiler.yml'
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Build & Deploy Go Container Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Go Build & Syntax
        run: |
          go vet ./...
          go build -v ./cmd/server

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Wrangler & Dependencies
        working-directory: workers/compiler
        run: npm ci

      - name: Build & Push Container Image to Cloudflare Registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9daa44579604e972e3ca21aa980a92d7' }}
        run: |
          npx wrangler containers build . -t blockads-compiler:v1 --push

      - name: Deploy Container Worker
        working-directory: workers/compiler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9daa44579604e972e3ca21aa980a92d7' }}
        run: |
          npx wrangler deploy
